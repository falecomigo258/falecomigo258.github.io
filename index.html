<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FALE COMIGO</title>
<style>
body{margin:0;background:#1A2B4A;color:#fff;font-family:Arial;padding-bottom:100px}
.top{display:flex;justify-content:space-between;padding:14px}
.pill{border:1px solid #E8C268;background:#2A3F6B;color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer}
.hero{padding:10px 20px}.hero h1{margin:0;font-size:42px}.hero h2{color:#E8C268;font-size:32px;margin:5px 0;cursor:pointer}
.card{margin:12px;background:#263A66;border-radius:20px;padding:16px}
textarea,input,select{width:100%;padding:12px;border-radius:12px;border:0;font-size:15px;box-sizing:border-box}
.btn{width:100%;background:#E8C268;color:#1A2B4A;border:0;padding:14px;border-radius:12px;font-weight:900;margin-top:10px;cursor:pointer}
.post{background:#263A66;border-radius:20px;padding:16px;margin:12px}.btn2{background:#2A3F6B;color:#FFE9A8;border:1px solid #E8C268;padding:6px 10px;border-radius:999px;margin:3px;cursor:pointer}
.hidden{display:none!important}.bottom{position:fixed;left:12px;right:12px;bottom:12px;background:#24365F;display:flex;justify-content:space-around;padding:12px;border-radius:25px}.bottom button{background:none;border:0;color:#fff;cursor:pointer}
#secretModal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}#secretModal .box{background:#fff;color:#111;border-radius:20px;padding:20px;width:100%;max-width:320px;text-align:center}
</style>
</head>
<body>
<div class="top"><button class="pill" id="langBtn" onclick="trocaIdioma()">PT 🇵🇹</button><button class="pill" onclick="alert('Tema mudado')">☀️ 🌙</button></div>
<div class="hero"><h1 id="t1">FALE COMIGO</h1><h2 id="t2" onclick="secretClick()">DEUS É CONTIGO ✨</h2><p id="t3">Anónimo • Sem julgamentos</p></div>
<div class="card"><h3 id="t4">Desabafa aqui</h3><textarea id="txt" rows="3" placeholder="Escreva aqui..."></textarea><button class="btn" id="t5" onclick="sendPost()">Enviar Desabafo</button><p style="font-size:12px;color:#A9B8D4">Recebes um código para apagar depois.</p></div>
<div id="feed"></div>
<div class="card"><h3>Ser Voluntário</h3><input id="vNome" placeholder="Nome"><input id="vNum" placeholder="WhatsApp" style="margin-top:8px"><button class="btn" onclick="beVolunteer()">Quero Ajudar ❤️</button></div>
<div class="card"><h3>Apagar meu desabafo</h3><input id="delCode" placeholder="Código"><button class="btn" onclick="deleteMyPost()">Apagar com Código</button></div>
<div id="adminArea" class="hidden"><div class="card"><div style="background:#fff;color:#111;border-radius:16px;padding:14px"><b>PAINEL BOSS</b><p>Visitas: <span id="rVisit">0</span> | Desabafos: <span id="rPost">0</span></p><button class="btn" onclick="closeAdmin()">Fechar</button></div></div></div>
<div class="bottom"><button onclick="window.scrollTo(0,0)">🏠 Home</button><button onclick="alert('Conversa')">💬 Conversa</button></div>
<div id="secretModal"><div class="box"><h2>🙏 Amém</h2><input id="secretInput" type="password" placeholder="Código"><button class="btn" onclick="checkSecret()">Entrar</button><button class="pill" style="color:#111;margin-top:10px" onclick="closeSecret()">Cancelar</button></div></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
var langPT = true;
function trocaIdioma(){
  langPT = !langPT;
  if(langPT){
    document.getElementById("langBtn").innerText = "PT 🇵🇹";
    document.getElementById("t1").innerText = "FALE COMIGO";
    document.getElementById("t2").innerText = "DEUS É CONTIGO ✨";
    document.getElementById("t3").innerText = "Anónimo • Sem julgamentos";
    document.getElementById("t4").innerText = "Desabafa aqui";
    document.getElementById("t5").innerText = "Enviar Desabafo";
  } else {
    document.getElementById("langBtn").innerText = "EN 🇬🇧";
    document.getElementById("t1").innerText = "TALK TO ME";
    document.getElementById("t2").innerText = "GOD IS WITH YOU ✨";
    document.getElementById("t3").innerText = "Anonymous • No judgment";
    document.getElementById("t4").innerText = "Share here";
    document.getElementById("t5").innerText = "Send";
  }
  alert("Idioma trocado!");
}
var _clicks = 0;
function secretClick(){
  _clicks++;
  if(_clicks >= 6){ _clicks = 0; document.getElementById("secretModal").style.display = "flex"; }
}
function closeSecret(){ document.getElementById("secretModal").style.display = "none"; }
function checkSecret(){
  var v = document.getElementById("secretInput").value;
  if(v === "9o90973gwi53"){
    closeSecret();
    document.getElementById("adminArea").classList.remove("hidden");
    alert("Bem-vindo Boss!");
  } else { alert("Código errado"); }
}
function closeAdmin(){ document.getElementById("adminArea").classList.add("hidden"); }
var firebaseConfig = {apiKey:"AIzaSyDAuMMta5I-NsqoEgJm-tbtuljlY85Lnjg",authDomain:"falecomigo-fe950.firebaseapp.com",databaseURL:"https://falecomigo-fe950-default-rtdb.firebaseio.com",projectId:"falecomigo-fe950",storageBucket:"falecomigo-fe950.firebasestorage.app",messagingSenderId:"69315194447",appId:"1:69315194447:web:b8ea8935dcbbaa1bb1043a"};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
try{ firebase.auth().signInAnonymously(); }catch(e){}
var myId = localStorage.getItem("myAnon") || ("Anónimo " + Math.floor(100+Math.random()*900));
localStorage.setItem("myAnon", myId);
var allPosts = {};
var lastPostTime = 0;
function sendPost(){
  alert("Botão clicado! A tentar publicar...");
  var now = Date.now();
  if(now - lastPostTime < 60000){ alert("Espera 1 minuto"); return; }
  var t = document.getElementById("txt").value.trim();
  if(!t){ alert("Escreve alguma coisa primeiro"); return; }
  var code = Math.floor(1000+Math.random()*9000);
  db.ref("posts").push({text:t, time:Date.now(), hug:0, heart:0, pray:0, code:code, letter:"A"}).then(function(){
    document.getElementById("txt").value = "";
    alert("Publicado! Código: " + code);
  }).catch(function(e){ alert("Erro Firebase: " + e.message); });
  lastPostTime = now;
}
function react(id, type){
  alert("Reação: " + type);
  db.ref("posts/" + id + "/" + type).transaction(function(v){ return (v||0)+1; });
}
function deleteMyPost(){
  var c = document.getElementById("delCode").value.trim();
  var found = null;
  Object.keys(allPosts).forEach(function(k){ if(String(allPosts[k].code) === c) found = k; });
  if(!found){ alert("Código errado"); return; }
  db.ref("posts/" + found).remove();
  alert("Apagado!");
}
function beVolunteer(){
  var n = document.getElementById("vNome").value;
  var nm = document.getElementById("vNum").value;
  if(!n || !nm){ alert("Preenche nome e número"); return; }
  db.ref("volunteers").push({name:n, number:nm}).then(function(){ alert("Pedido enviado!"); });
}
function renderFeed(){
  var h = "";
  var keys = Object.keys(allPosts).sort(function(a,b){ return allPosts[b].time - allPosts[a].time; });
  keys.forEach(function(k){
    var p = allPosts[k];
    h += '<div class="post"><b>Anónimo</b><p>' + p.text + '</p><button class="btn2" onclick="react(\'' + k + '\',\'hug\')">🤗 Abraço ' + (p.hug||0) + '</button><button class="btn2" onclick="react(\'' + k + '\',\'heart\')">🤍 ' + (p.heart||0) + '</button><button class="btn2" onclick="react(\'' + k + '\',\'pray\')">🙏 Orar ' + (p.pray||0) + '</button></div>';
  });
  document.getElementById("feed").innerHTML = h || "<p style='text-align:center'>Nenhum desabafo ainda.</p>";
}
db.ref("posts").on("value", function(s){
  var v = s.val() || {};
  allPosts = v;
  renderFeed();
});
</script>
</body>
</html>
